services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
    volumes:
      - nexus-postgres:/var/lib/postgresql/data
      - ./apps/api/infra/postgres-init/01-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nexus-pgadmin
    restart: unless-stopped
    # Dev-only GUI — opt in with `docker compose --profile tools up`.
    profiles: ['tools']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@nexus.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-nexus}
    ports:
      - '5050:80'
    volumes:
      - nexus-pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    volumes:
      - nexus-redis:/data
    command: redis-server --appendonly yes

  benchwork:
    image: ghcr.io/pontusab/workbench-standalone:latest
    platform: linux/amd64
    # Dev-only BullMQ dashboard — opt in with `docker compose --profile tools up`.
    # (amd64-only image, so it runs emulated on Apple Silicon.)
    profiles: ['tools']
    ports:
      - '3002:3000'
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QUEUE_NAMES: ${QUEUE_NAMES:-ai-generation,artifact-generation,kickoff,knowledge,knowledge-process,knowledge-remove}
    depends_on:
      - redis

  redisinsight:
    image: redis/redisinsight:latest
    # Dev-only Redis GUI — opt in with `docker compose --profile tools up`.
    profiles: ['tools']
    ports:
      - '5540:5540'
    volumes:
      - nexus-redisinsight:/data
    depends_on:
      - redis

  # minio:
