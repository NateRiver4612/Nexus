  #     mc mb --ignore-existing local/$$S3_BUCKET;
  #     exit 0;
  #     "

  nexus-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nexus-api:latest
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus}
      S3_BUCKET: ${S3_BUCKET:-nexus}
      S3_REGION: ${S3_REGION:-us-east-1}
      # These are S3-compatible / MinIO-specific values, commented out because
      # Nexus runs on AWS S3 where the endpoint is derived from the region and
      # credentials come from the attached IAM role (FullAccess policy) via the
      # SDK's default credential chain. Only re-enable them in dev when running
      # against a self-hosted S3-compatible store (e.g. MinIO in local dev).
      # S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      # S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      # S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: ${PORT:-3001}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3001}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001/api/auth}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nexus-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: nexus-web:latest
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      # Browser-facing API URL
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - nexus-api
volumes:
  nexus-postgres:
  nexus-redis:
  nexus-redisinsight:
  nexus-pgadmin:
