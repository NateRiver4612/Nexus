name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # lets the job assume the AWS role via OIDC (no stored AWS keys)
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy that's mid-flight

env:
  AWS_REGION: us-east-1 # change to your region

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      # amd64 matches a t3.micro. If your EC2 is a Graviton (t4g) box, run `uname -m` there:
      # aarch64 means switch both builds to linux/arm64.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/nexus-api:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ steps.ecr.outputs.registry }}/nexus-web:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Sync compose file, init SQL, and deploy script
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key $SSH_USER@$HOST"
          $SSH "mkdir -p /opt/nexus/postgres-init"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml deploy/remote-deploy.sh "$SSH_USER@$HOST:/opt/nexus/"
          scp -i ~/.ssh/deploy_key apps/api/infra/postgres-init/01-vector.sql "$SSH_USER@$HOST:/opt/nexus/postgres-init/"

      - name: Deploy
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
          ECR_REGISTRY: ${{ needs.build.outputs.registry }}
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$HOST" \
            "cd /opt/nexus && AWS_REGION=$AWS_REGION ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG bash remote-deploy.sh"
